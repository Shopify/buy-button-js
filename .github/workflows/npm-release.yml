name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    name: Production release to npm
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Shopify'
    permissions:
      contents: write      # push version commits, create GitHub releases
      pull-requests: write # create/update the "[ci] release" PR
      id-token: write      # OIDC for npm provenance attestation
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Check for rollback version
        id: version-check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *"ROLLBACK"* ]]; then
            echo "is_rollback=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping npm publish for rollback version $VERSION"
          else
            echo "is_rollback=false" >> "$GITHUB_OUTPUT"
          fi

      # Rollback versions skip npm publish entirely — the CDN revert is
      # handled manually via Shipit + CDN purge. See "Rollback" in AGENTS.md.
      - name: Create Release Pull Request or Publish
        if: steps.version-check.outputs.is_rollback != 'true'
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          version: pnpm exec changeset version
          publish: pnpm exec changeset publish
          commit: '[ci] release'
          title: '[ci] release'
        env:
          # A PAT (not the built-in GITHUB_TOKEN) is required here. GitHub
          # Actions blocks events from GITHUB_TOKEN from triggering workflows,
          # so merging the release PR would not re-trigger this workflow for
          # the publish step. SHOPIFY_GH_ACCESS_TOKEN is a GitHub App token
          # scoped to this repo only (contents:write, pull-requests:write),
          # rotated every 2 hours via github-actions-access-provider.
          GITHUB_TOKEN: ${{ secrets.SHOPIFY_GH_ACCESS_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
