---
name: buy-button-js

up:
  - node:
      version: v24.19.0 # .nvmrc uses 'v24' for nvm flexibility; dev tool needs specific version
      package_manager: pnpm@10.16.1
      packages:
        - .
  # Ruby + Jekyll for the local docs preview server (`pnpm run docs`).
  # The live docs site is built from /docs on main by GitHub Pages.
  - ruby
  - bundler

commands:
  test:
    run: pnpm run test
  server:
    run: pnpm run build && pnpm run start
  build:
    run: pnpm run build
  docs:
    run: pnpm run docs

open:
  app: 'http://localhost:8080/'
  docs: 'http://localhost:4000/buy-button-js/'
