---
name: buy-button-js

up:
  - node:
      version: v24.19.0 # .nvmrc uses 'v24' for nvm flexibility; dev tool needs specific version
      pnpm: 10.16.1

commands:
  test:
    run: pnpm run test
  start:
    run: pnpm run start
  build:
    run: pnpm run build
  docs:
    run: pnpm run docs

open:
  example: 'http://localhost:8080/'
  docs: 'http://localhost:4000/buy-button-js/'
